[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "mosaic-spatial"
version = "0.1.0"
description = "Mapping Organizational States Across InterCellular Ecosystems"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Ayse A. Koksoy" }
]
keywords = [
    "spatial biology",
    "spatial omics",
    "computational biology",
    "graph analysis",
    "network science",
    "digital pathology",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "networkx>=3.1",
]


[project.optional-dependencies]
test = [
    "pytest>=8.0",
]


[project.urls]
Homepage = "https://github.com/AAKoksoy/MOSAIC"
Repository = "https://github.com/AAKoksoy/MOSAIC"
Issues = "https://github.com/AAKoksoy/MOSAIC/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["mosaic*"]


[tool.pytest.ini_options]
testpaths = ["mosaic"]
python_files = ["test_*.py"]
addopts = "-v"
